services:
  - type: web
    name: doctalker-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_URL
        value: https://doctalker-backend-qwzh.onrender.com
      - key: CORS_ORIGIN
        value: https://doctalkerfrontend.vercel.app,https://app.doctalker.ai
      - key: FRONTEND_URL
        value: https://doctalkerfrontend.vercel.app
